<!DOCTYPE html>

<head>

  <meta charset="UTF-8">

  <script>(function(){try{var u=JSON.parse(sessionStorage.getItem('user')||'null');if(u&&u.role)document.documentElement.setAttribute('data-role',u.role);}catch(e){}})();</script>
  <link rel="stylesheet" href="shared.css">
</head>
<body>
<div class="cms-wrapper">

  <aside class="cms-sidebar" id="sidebar">

           onerror="this.style.display='none';this.nextElementSibling.style.display='block'">
      <span class="logo-fallback">The Frontline</span>
    </div>
    <nav class="sidebar-nav">
      <ul>
        <li class="active"><a href="dashboard.html">
          <svg viewBox="0 0 20 20" fill="currentColor"><rect x="2" y="2" width="7" height="7" rx="1"/><rect x="11" y="2" width="7" height="7" rx="1"/><rect x="2" y="11" width="7" height="7" rx="1"/><rect x="11" y="11" width="7" height="7" rx="1"/></svg>
          Dashboard</a></li>
        <li class="nav-group"><a class="adviser-parent" href="articles.html">
          <svg viewBox="0 0 20 20" fill="currentColor"><path d="M4 4h12v2H4V4zm0 4h12v2H4V8zm0 4h8v2H4v-2z"/></svg>
          Articles</a>
          <button type="button" class="nav-toggle adviser-toggle" aria-expanded="false">
          <svg viewBox="0 0 20 20" fill="currentColor"><path d="M4 4h12v2H4V4zm0 4h12v2H4V8zm0 4h8v2H4v-2z"/></svg>
          <span>Articles</span><span class="nav-chevron" aria-hidden="true"></span></button>
          <ul class="sub-nav" hidden>
            <li><a href="articles.html">View Article</a></li>
            <li id="li-approval-queue"><a href="approval-queue.html">Approval Queue</a></li>
          </ul></li>
        <li><a href="media.html">
          <svg viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M4 3h12a2 2 0 012 2v10a2 2 0 01-2 2H4a2 2 0 01-2-2V5a2 2 0 012-2zm0 2v10h12V5H4zm1.5 8l3-4 2.2 2.6 1.6-1.9L14.5 13h-9z" clip-rule="evenodd"/></svg>
          Media</a></li>
        <li><a href="archive.html">
          <svg viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M4 3h12a1 1 0 011 1v2a1 1 0 01-1 1H4a1 1 0 01-1-1V4a1 1 0 011-1zm0 5h12v9a1 1 0 01-1 1H5a1 1 0 01-1-1V8z" clip-rule="evenodd"/></svg>
          Archive</a></li>
        <li class="non-adviser-only"><a href="correspondents.html">
          <svg viewBox="0 0 20 20" fill="currentColor"><path d="M10 9a3 3 0 100-6 3 3 0 000 6zm-7 9a7 7 0 1114 0H3z"/></svg>
          Correspondents</a></li>
        <li id="li-user-management" class="nav-group admin-only"><button type="button" class="nav-toggle" aria-expanded="false">
          <svg viewBox="0 0 20 20" fill="currentColor"><path d="M7 9a3 3 0 100-6 3 3 0 000 6zm-5 8a5 5 0 0110 0v1H2v-1zm12-8a3 3 0 100-6 3 3 0 000 6zm1 1h-1a4.97 4.97 0 00-2.2 1.2A4.9 4.9 0 0115 17v1h3v-1a4 4 0 00-3-4.2z"/></svg>
          <span>User Management</span><span class="nav-chevron" aria-hidden="true"></span></button>
          <ul class="sub-nav" hidden>
            <li><a href="correspondents.html">Correspondents</a></li>
            <li><a href="user-management.html">Role and Status</a></li>
          </ul></li>
      </ul>
      <ul class="nav-foot">
        <li><a href="settings.html">
          <svg viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M11.49 3.17c-.38-1.56-2.6-1.56-2.98 0a1.532 1.532 0 01-2.286.948c-1.372-.836-2.942.734-2.106 2.106.54.886.061 2.042-.947 2.287-1.561.379-1.561 2.6 0 2.978a1.532 1.532 0 01.947 2.287c-.836 1.372.734 2.942 2.106 2.106a1.532 1.532 0 012.287.947c.379 1.561 2.6 1.561 2.978 0a1.533 1.533 0 012.287-.947c1.372.836 2.942-.734 2.106-2.106a1.533 1.533 0 01.947-2.287c1.561-.379 1.561-2.6 0-2.978a1.532 1.532 0 01-.947-2.287c.836-1.372-.734-2.942-2.106-2.106a1.532 1.532 0 01-2.287-.947zM10 13a3 3 0 100-6 3 3 0 000 6z" clip-rule="evenodd"/></svg>
          Settings</a></li>
      </ul>
    </nav>
  </aside>
  <div class="sidebar-overlay" id="sidebarOverlay"></div>

  <div class="cms-main">
    <header class="cms-topbar">
      <button class="topbar-hamburger" id="hamburger" aria-label="Menu">
        <svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="2" y1="5" x2="18" y2="5"/><line x1="2" y1="10" x2="18" y2="10"/><line x1="2" y1="15" x2="18" y2="15"/></svg>
      </button>
      <div class="search-wrap">
        <svg width="15" height="15" viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M8 4a4 4 0 100 8 4 4 0 000-8zM2 8a6 6 0 1110.89 3.476l4.817 4.817a1 1 0 01-1.414 1.414l-4.816-4.816A6 6 0 012 8z" clip-rule="evenodd"/></svg>
        <input type="text" id="topbar-search" placeholder="Search" autocomplete="new-password" readonly onfocus="this.removeAttribute('readonly')">
      </div>
      <div class="topbar-user">
        <div class="user-text">
          <div class="user-name" id="topbar-username">Loading...</div>
          <div class="user-role" id="topbar-role"></div>
        </div>
        <div class="user-avatar" id="topbar-avatar">
          <svg width="20" height="20" viewBox="0 0 20 20" fill="currentColor"><path d="M10 9a3 3 0 100-6 3 3 0 000 6zm-7 9a7 7 0 1114 0H3z"/></svg>
        </div>
      </div>
    </header>

    <main class="cms-content">
      <h1 class="page-title">Dashboard</h1>
      <p class="page-subtitle" id="dash-greeting">Greetings in pursuit of press freedom!</p>

      <div class="section-title">Recently Published</div>
      <div id="dashboard-content"></div>
    </main>
  </div>
</div>

<script src="cms.js"></script>
<script type="module">
  import { requireAuth, logoutUser } from '../backend/firebase/auth.js';
  import { getPublishedArticles, articleSection } from '../backend/firebase/firestore.js';

  // ── Auth guard ──
  const user = requireAuth(['correspondent', 'editorial', 'adviser']);
  if (!user) throw new Error('Redirecting to login...');

  // ── Populate topbar ──
  document.getElementById('topbar-username').textContent =
    user.name || `${user.firstName} ${user.surname}` || 'User';
  document.getElementById('topbar-role').textContent =
    user.role === 'adviser' ? 'Adviser' : user.role === 'editorial' ? 'Editorial Board' : 'Correspondent';
  document.getElementById('dash-greeting').textContent =
    `Welcome back, ${toTitleCaseName(user.firstName || 'there')}! Greetings in pursuit of press freedom!`;

  // ── Topbar avatar ──
  if (user.photoURL) {
    document.getElementById('topbar-avatar').innerHTML =
      `<img src="${user.photoURL}" style="width:100%;height:100%;object-fit:cover;border-radius:50%;">`;
  }
  window.__frontlineLogout = logoutUser;

  // ── Load published articles ──
  const container = document.getElementById('dashboard-content');

  try {
    const articles = await getPublishedArticles(12);

    if (!articles.length) {
      container.innerHTML = `<p class="empty-msg">No published articles yet. Articles appear here once an adviser publishes them.</p>`;
    } else {
      const grid = document.createElement('div');
      grid.className = 'cards-grid';
      articles.forEach(a => {
        grid.innerHTML += `
          <div class="article-card" onclick="window.location.href='article-view.html?id=${a.id}'">
            ${a.coverPhoto
              ? `<img class="card-img" src="${a.coverPhoto}" alt="${a.title}">`
              : `<div class="card-img" style="background:var(--ink);"></div>`
            }
            <div class="card-body">
              <div class="card-section">${articleSection(a).toUpperCase()}</div>
              <div class="card-title">${a.title || 'Untitled'}</div>
              <div class="card-excerpt">${a.excerpt || ''}</div>
              <div class="card-author">by ${toTitleCaseName(a.writerName || a.authorName || 'Unknown')}</div>
            </div>
          </div>`;
      });
      container.innerHTML = '';
      container.appendChild(grid);
    }
  } catch (e) {
    console.error(e);
    container.innerHTML = `<p class="empty-msg">Published articles couldn’t load. Refresh the page to try again.</p>`;
  }
</script>
</body>
</html>
