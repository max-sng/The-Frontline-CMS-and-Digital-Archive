<!DOCTYPE html>
<html lang="en">
<head>
  <script src="image-fallback.js"></script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset Password — The Frontline</title>
  <link rel="icon" type="image/png" href="assets/app-logo.png">
  <link rel="stylesheet" href="auth.css">
</head>
<body>

  <div class="auth-left"></div>

  <div class="auth-panel">
    <div class="auth-inner">

      <img src="assets/frontline-logo.png" alt="The Frontline" class="auth-logo">

      <h1 class="auth-title">Reset your password</h1>
      <p class="auth-subtitle">Enter your email and we'll send you a reset link.</p>

      <div class="auth-form">
        <div class="auth-field">
          <label class="auth-label" for="reset-email">Email</label>
          <div class="auth-input-wrap">
            <span class="input-icon">
              <svg width="15" height="15" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></svg>
            </span>
            <input type="email" class="auth-input" placeholder="email@gordoncollege.edu.ph"
                   id="reset-email" autocomplete="email">
          </div>
        </div>

        <button class="auth-btn" id="reset-btn" onclick="sendReset()">Send reset link</button>

        <p class="auth-bottom" style="margin-bottom:12px;">Remembered it? <a href="login.html">Back to Login</a></p>

        <div class="reset-alert success hidden" id="alert-success" role="status">
          <svg width="14" height="14" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5"><polyline points="20 6 9 17 4 12"/></svg>
          <span id="success-msg">Reset link sent! Check your email inbox.</span>
        </div>
        <div class="reset-alert error hidden" id="alert-error" role="alert">
          <svg width="14" height="14" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
          <span id="error-msg">No account found with this email.</span>
        </div>
      </div>

      <div class="auth-footer">Copyright &copy; 2026 &middot; Team TriDev</div>
    </div>
  </div>

  <script type="module">
    import { resetPassword } from '../backend/firebase/auth.js';

    const RESEND_SECONDS = 30;
    const btn = document.getElementById('reset-btn');
    let sending = false;
    let cooldownTimer = null;

    function startCooldown() {
      let seconds = RESEND_SECONDS;
      btn.disabled = true;
      btn.textContent = `Resend link (${seconds}s)`;
      clearInterval(cooldownTimer);
      cooldownTimer = setInterval(() => {
        seconds--;
        if (seconds <= 0) {
          clearInterval(cooldownTimer);
          cooldownTimer = null;
          btn.disabled = false;
          btn.textContent = 'Resend link';
        } else {
          btn.textContent = `Resend link (${seconds}s)`;
        }
      }, 1000);
    }

    window.sendReset = async function() {
      if (sending || cooldownTimer) return;
      const email     = document.getElementById('reset-email').value.trim();
      const successEl = document.getElementById('alert-success');
      const successMsg = document.getElementById('success-msg');
      const errorEl   = document.getElementById('alert-error');
      const errorMsg  = document.getElementById('error-msg');

      successEl.classList.add('hidden');
      errorEl.classList.add('hidden');

      if (!email) {
        errorMsg.textContent = 'Enter the email address you registered with.';
        errorEl.classList.remove('hidden');
        return;
      }
      if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)) {
        errorMsg.textContent = 'Enter a valid email address, like name@gordoncollege.edu.ph.';
        errorEl.classList.remove('hidden');
        return;
      }

      sending = true;
      btn.textContent = 'Sending…';
      btn.disabled = true;

      const result = await resetPassword(email);
      sending = false;

      if (result.success) {
        // Firebase does not reveal whether an account exists for this email, so the
        // confirmation is worded to be true either way.
        successMsg.textContent = `If an account exists for ${email.toLowerCase()}, a reset link is on its way. Check your inbox and spam folder. The link expires in 1 hour.`;
        successEl.classList.remove('hidden');
        startCooldown();
      } else {
        errorMsg.textContent = result.error;
        errorEl.classList.remove('hidden');
        btn.textContent = 'Send reset link';
        btn.disabled = false;
      }
    };

    document.addEventListener('keydown', e => {
      if (e.key === 'Enter') window.sendReset();
    });

    // Pre-fill the email when coming from the login page.
    const params = new URLSearchParams(window.location.search);
    if (params.get('email')) document.getElementById('reset-email').value = params.get('email');
  </script>
</body>
</html>
