        <main class="cms-content">

        <div class="media-search">
          <svg width="14" height="14" viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M8 4a4 4 0 100 8 4 4 0 000-8zM2 8a6 6 0 1110.89 3.476l4.817 4.817a1 1 0 01-1.414 1.414l-4.816-4.816A6 6 0 012 8z" clip-rule="evenodd"/></svg>
          <input type="search" id="queue-search" placeholder="Search queue..." aria-label="Search queue" autocomplete="off">

      <div id="queue" style="margin-top:18px">Loading…</div>

  <script src="cms.js"></script>
    <script type="module">
    import { requireAuth, logoutUser } from '../backend/firebase/auth.js';
    import { getAllArticles, updateArticleStatus, articleSection } from '../backend/firebase/firestore.js';

    const user = requireAuth(['adviser']);
    if (!user) throw new Error('Not authorised');
    document.getElementById('topbar-username').textContent = user.name || user.firstName || 'Admin';
    document.getElementById('topbar-role').textContent = 'Adviser';
    if (user.photoURL) document.getElementById('topbar-avatar').innerHTML = `<img src="${user.photoURL}" style="width:100%;height:100%;object-fit:cover;border-radius:50%;">`;
    window.__frontlineLogout = logoutUser;

    const STATUS_LABELS = {
      pending_adviser: 'Awaiting Final Approval'
    };

    function escapeHtml(value) {
      return String(value ?? '').replace(/[&<>"']/g, character => ({
        '&': '&amp;',
        '<': '&lt;',
        '>': '&gt;',
        '"': '&quot;',
        "'": '&#39;'
      })[character]);
    }

    function applyFilter(query) {
      const q = (query || '').toLocaleLowerCase();
      document.querySelectorAll('#queue tbody tr').forEach(row => {
        row.style.display = !q || row.textContent.toLocaleLowerCase().includes(q) ? '' : 'none';
      });
    }

    async function loadQueue() {
      const container = document.getElementById('queue');
      container.textContent = 'Loading…';
      try {
        const all = await getAllArticles();
        const list = all.filter(a => a.status === 'pending_adviser');
        if (!list.length) {
          container.innerHTML = '<div class="empty-state empty-state-plain"><div class="empty-state-title">Nothing to approve</div><div class="empty-state-sub">Articles sent to you for final approval will appear here.</div></div>';
          return;
        }
        const rows = list.map(a => {
          const status = escapeHtml(a.status);
          return `
          <tr>
            <td data-label="Writer">${escapeHtml(toTitleCaseName(a.writerName || a.authorName || '—'))}</td>
            <td data-label="Section">${escapeHtml(toTitleCaseName(articleSection(a)))}</td>
            <td class="title-cell" data-label="Title">${escapeHtml(a.title || 'Untitled')}</td>
            <td data-label="Status"><span class="status-badge status-readonly ${status}"><span class="status-pill-dot dot-${status}"></span><span>${escapeHtml(STATUS_LABELS[a.status] || a.status)}</span></span></td>
            <td data-label="Action" style="text-align:center">
              <div class="options-cell" style="justify-content:center">
                <button class="btn btn-outline table-btn" type="button" data-id="${escapeHtml(a.id)}" data-action="reject">Reject</button>
                <button class="btn btn-red table-btn" type="button" data-id="${escapeHtml(a.id)}" data-action="publish">Approve</button>
              </div>
            </td>
          </tr>`;
        }).join('');
        container.innerHTML = `
          <div class="table-wrap">
            <table class="articles-table" style="table-layout:fixed;width:100%;border:0;border-radius:0;">
              <colgroup>
                <col style="width:18%"><col style="width:12%"><col style="width:38%"><col style="width:18%"><col style="width:14%">
              </colgroup>
              <thead><tr>
                <th>Writer</th><th>Section</th><th>Title</th><th>Status</th><th style="text-align:center">Action</th>
              </tr></thead>
              <tbody>${rows}</tbody>
            </table>
          </div>`;
        applyFilter(document.getElementById('queue-search').value);
      } catch (e) {
        console.error('Failed to load approval queue:', e);
        container.innerHTML = '<div class="empty-state empty-state-plain"><div class="empty-state-title">The approval queue couldn’t load</div></div>';
      }
    }

    document.getElementById('queue').addEventListener('click', async (e) => {
      const btn = e.target.closest('button');
      if (!btn) return;
      const id = btn.dataset.id;
      const act = btn.dataset.action;
      if (act === 'publish') {
        btn.disabled = true; btn.textContent = 'Publishing...';
        const r = await updateArticleStatus(id, 'published');
        if (r.success) { btn.textContent = 'Published'; showToast('Article published.', 'success'); }
        else { btn.textContent = 'Publish'; btn.disabled = false; showToast(r.error || "Couldn't publish the article. Try again.", 'error'); return; }
        await loadQueue();
      } else if (act === 'reject') {
        btn.disabled = true; btn.textContent = 'Rejecting...';
        const r = await updateArticleStatus(id, 'draft');
        if (r.success) { btn.textContent = 'Rejected'; showToast('Article sent back to drafts.', 'success'); }
        else { btn.textContent = 'Reject'; btn.disabled = false; showToast(r.error || "Couldn't reject the article. Try again.", 'error'); return; }
        await loadQueue();
      }
    });

    document.getElementById('queue-search').addEventListener('input', e => applyFilter(e.target.value));
    // Topbar search (wired in cms.js) filters the queue as well.
    document.addEventListener('frontline:search', e => {
      e.preventDefault();
      applyFilter(e.detail?.query || '');
    });

    loadQueue();
  </script>
