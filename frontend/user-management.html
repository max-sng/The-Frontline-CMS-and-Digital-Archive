<dialog class="confirm-dialog" id="confirm-dialog" aria-labelledby="confirm-title" aria-describedby="confirm-body">
  <form method="dialog">
    <h2 class="confirm-title" id="confirm-title"></h2>
    <div class="confirm-body" id="confirm-body"></div>
    <p class="confirm-error" id="confirm-error" role="alert"></p>
    <div class="confirm-actions">
      <button class="btn btn-outline" type="submit" value="cancel" id="confirm-cancel">Cancel</button>
      <button class="btn btn-red" type="button" id="confirm-ok"></button>
    </div>
  </form>
</dialog>

  <script src="cms.js"></script>
    <script type="module">
    import { requireAuth, logoutUser, deactivateUser, changeUserRole } from '../backend/firebase/auth.js';
    import { getAllUsers, approveEditorial } from '../backend/firebase/firestore.js';

    const user = requireAuth(['adviser']);
    if (!user) throw new Error('Not authorised');
    document.getElementById('topbar-username').textContent = user.name || user.firstName || 'Admin';
    document.getElementById('topbar-role').textContent = 'Adviser';
    if (user.photoURL) document.getElementById('topbar-avatar').innerHTML = `<img src="${user.photoURL}" style="width:100%;height:100%;object-fit:cover;border-radius:50%;">`;
    window.__frontlineLogout = logoutUser;

    const STATUS_DOTS = { active: 'dot-published', deactivated: 'dot-draft', invited: 'dot-reviewed', pending: 'dot-pending' };
    const ROLE_LABELS = { adviser: 'Adviser', editorial: 'Editorial', correspondent: 'Correspondent' };

    function escapeHtml(value) {
      return String(value ?? '').replace(/[&<>"']/g, character => ({
        '&': '&amp;',
        '<': '&lt;',
        '>': '&gt;',
        '"': '&quot;',
        "'": '&#39;'
      })[character]);
    }

    // Hierarchy: your own account first, then Adviser → Editorial → pending Editorial → Correspondent.
    // Within a role, active accounts come before deactivated ones, then alphabetical by name.
    const ROLE_RANK = { adviser: 0, editorial: 1, pending_editorial: 2, correspondent: 3 };
    function displayName(u) {
      return toTitleCaseName(u.name || [u.firstName, u.surname].filter(Boolean).join(' ') || '') || 'User';
    }
    function sortUsers(list) {
      return [...list].sort((a, b) =>
        (b.id === user.uid) - (a.id === user.uid)
        || (ROLE_RANK[a.role] ?? 4) - (ROLE_RANK[b.role] ?? 4)
        || ((a.status === 'deactivated') - (b.status === 'deactivated'))
        || displayName(a).localeCompare(displayName(b))
      );
    }

    function applyFilter(query) {
      const q = (query || '').toLocaleLowerCase();
      document.querySelectorAll('#users-list tbody tr').forEach(row => {
        row.style.display = !q || row.textContent.toLocaleLowerCase().includes(q) ? '' : 'none';
      });
    }

    async function loadUsers() {
      const container = document.getElementById('users-list');
      container.textContent = 'Loading…';
      try {
        const all = sortUsers(await getAllUsers());
        if (!all.length) { container.innerHTML = '<div class="empty-state empty-state-plain"><div class="empty-state-title">No users found</div></div>'; return; }
        const rows = all.map(u => {
          const isPendingEditorial = u.role === 'pending_editorial';
          const isCurrentUser = u.id === user.uid;
          const name = displayName(u);
          const status = u.status || 'active';

          const isDeactivated = status === 'deactivated';

          // Own account and pending registrations show a read-only pill; everyone else gets an
          // inline dropdown that saves on change.
          const roleCell = (isPendingEditorial || isCurrentUser)
            ? `<span class="status-badge status-readonly role-readonly"><span>${isPendingEditorial ? 'Editorial (pending)' : escapeHtml(ROLE_LABELS[u.role] || 'Correspondent')}</span></span>`
            : `<select data-uid="${escapeHtml(u.id)}" data-name="${escapeHtml(name)}" class="role-select users-role-select" aria-label="Role for ${escapeHtml(name)}">
                 <option value="adviser">Adviser</option>
                 <option value="editorial">Editorial</option>
                 <option value="correspondent">Correspondent</option>
               </select>`;

          const actions = isPendingEditorial
            ? `<button class="btn btn-red" type="button" data-uid="${escapeHtml(u.id)}" data-act="approve">Approve</button>`
            : isCurrentUser
              ? '<span class="current-account-label">Current account</span>'
              : isDeactivated
                ? '<span class="current-account-label">—</span>'
                : `<button class="btn btn-red" type="button" data-uid="${escapeHtml(u.id)}" data-name="${escapeHtml(name)}" data-act="deactivate">Deactivate</button>`;

          return `
          <tr class="user-row" data-role-value="${escapeHtml(u.role || 'correspondent')}">
            <td data-label="Name">${escapeHtml(name)}</td>
            <td data-label="Email">${escapeHtml(u.email || '—')}</td>
            <td data-label="Role">${roleCell}</td>
            <td data-label="Status"><span class="status-badge status-readonly"><span class="status-pill-dot ${STATUS_DOTS[status] || 'dot-pending'}"></span><span>${escapeHtml(status.charAt(0).toUpperCase() + status.slice(1))}</span></span></td>
            <td data-label="Action" style="text-align:center"><div class="options-cell" style="justify-content:center">${actions}</div></td>
          </tr>`;
        }).join('');
        container.innerHTML = `
          <div class="table-wrap">
            <table class="articles-table" style="table-layout:fixed;width:100%;border:0;border-radius:0;">
              <colgroup>
                <col style="width:18%"><col style="width:32%"><col style="width:18%"><col style="width:18%"><col style="width:14%">
              </colgroup>
              <thead><tr>
                <th>Name</th><th>Email</th><th>Role</th><th>Status</th><th style="text-align:center">Action</th>
              </tr></thead>
              <tbody>${rows}</tbody>
            </table>
          </div>`;
        // Set each role dropdown to the user's current role (pending editorial rows have none)
        all.forEach(u => {
          const sel = container.querySelector(`select[data-uid="${CSS.escape(u.id)}"]`);
          if (sel) sel.value = sel.dataset.current = u.role || 'correspondent';
        });
        applyFilter(document.getElementById('users-search').value);
      } catch (e) {
        console.error('Failed to load users:', e);
        container.innerHTML = '<div class="empty-state empty-state-plain"><div class="empty-state-title">Users couldn’t load. Refresh the page to try again.</div></div>';
      }
    }

    document.getElementById('users-list').addEventListener('click', async (e) => {
      const btn = e.target.closest('button');
      if (!btn) return;
      const uid = btn.dataset.uid;
      const act = btn.dataset.act;
      if (act === 'deactivate') {
        const name = escapeHtml(btn.dataset.name || 'this user');
        openConfirm({
          title: `Deactivate ${name}?`,
          body: `<p>Their account will be marked as deactivated and they'll get a notification that an adviser deactivated it.</p>`,
          confirmLabel: 'Deactivate',
          busyLabel: 'Deactivating…',
          action: () => deactivateUser(uid),
        });
      } else if (act === 'approve') {
        btn.disabled = true; btn.textContent = 'Approving...';
        const r = await approveEditorial(uid);
        if (r.success) { btn.textContent = 'Approved'; showToast('Editorial account approved.', 'success'); }
        else { btn.textContent = 'Approve'; btn.disabled = false; showToast(r.error || "Couldn't approve this account. Try again.", 'error'); return; }
        await loadUsers();
      }
    });

    /* ── Confirm dialog ──
       openConfirm({ title, body (trusted HTML), confirmLabel, busyLabel, action, onCancel })
       `action` returns { success, error }. Success closes the dialog and reloads the list;
       failure keeps it open with the error so the adviser can retry or cancel. */
    const dlg = document.getElementById('confirm-dialog');
    const dlgOk = document.getElementById('confirm-ok');
    const dlgCancel = document.getElementById('confirm-cancel');
    const dlgError = document.getElementById('confirm-error');
    let pending = null;

    function openConfirm(opts) {
      pending = opts;
      document.getElementById('confirm-title').innerHTML = opts.title;
      document.getElementById('confirm-body').innerHTML = opts.body;
      dlgOk.textContent = opts.confirmLabel;
      dlgOk.disabled = false; dlgCancel.disabled = false;
      dlgError.classList.remove('visible'); dlgError.textContent = '';
      dlg.returnValue = '';
      dlg.showModal();
      dlgOk.focus();
    }

    dlgOk.addEventListener('click', async () => {
      if (!pending) return;
      const opts = pending;
      dlgOk.disabled = true; dlgCancel.disabled = true;
      dlgOk.textContent = opts.busyLabel || 'Saving…';
      let r;
      try { r = await opts.action(); } catch (err) { r = { success: false, error: err?.message }; }
      if (r?.success) {
        pending = null;
        dlg.close('done');
        await loadUsers();
        return;
      }
      dlgError.textContent = `${r?.error || 'Something went wrong.'} Please try again.`;
      dlgError.classList.add('visible');
      dlgOk.textContent = opts.confirmLabel;
      dlgOk.disabled = false; dlgCancel.disabled = false;
    });

    // Esc, Cancel, or backdrop click: undo whatever the dialog was asking about.
    dlg.addEventListener('close', () => {
      if (dlg.returnValue !== 'done' && pending) pending.onCancel?.();
      pending = null;
    });
    dlg.addEventListener('cancel', e => { if (dlgOk.disabled) e.preventDefault(); });
    dlg.addEventListener('click', e => { if (e.target === dlg && !dlgOk.disabled) dlg.close('cancel'); });

    const ROLE_SUMMARY = {
      adviser: 'Advisers give final approval before anything is published, approve editorial registrations, and manage users and site settings.',
      editorial: 'Editorial board members review submissions, assign stories, send approved work to the adviser, and manage correspondents and media.',
      correspondent: 'Correspondents draft articles, attach photos and cutlines, and submit their work for review.',
    };
    const ARROW = '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 8h10M9 4l4 4-4 4"/></svg>';

    // Role dropdown asks for confirmation before saving; cancelling restores the previous role.
    document.getElementById('users-list').addEventListener('change', (e) => {
      const sel = e.target.closest('select.users-role-select');
      if (!sel) return;
      const previous = sel.dataset.current;
      const next = sel.value;
      const name = escapeHtml(sel.dataset.name || 'this user');
      openConfirm({
        title: `Change ${name}'s role?`,
        body: `
          <div class="confirm-change">
            <span class="status-badge">${escapeHtml(ROLE_LABELS[previous] || previous)}</span>
            ${ARROW}
            <span class="status-badge is-new">${escapeHtml(ROLE_LABELS[next] || next)}</span>
          </div>
          <p style="margin-top:12px">${ROLE_SUMMARY[next] || ''}</p>`,
        confirmLabel: 'Change role',
        busyLabel: 'Saving…',
        action: () => changeUserRole(sel.dataset.uid, next),
        onCancel: () => { sel.value = previous; },
      });
    });

    document.getElementById('users-search').addEventListener('input', e => applyFilter(e.target.value));
    // Topbar search (wired in cms.js) filters the user list by name, email, role or status.
    document.addEventListener('frontline:search', e => {
      e.preventDefault();
      applyFilter(e.detail?.query || '');
    });

    loadUsers();
  </script>
