<!DOCTYPE html>
<html lang="en">
<head>
  <script src="image-fallback.js"></script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Correspondents – The Frontline CMS</title>
  <link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32.png">
  <link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
  <script>(function(){try{var u=JSON.parse(sessionStorage.getItem('user')||localStorage.getItem('user')||'null');if(u&&u.role)document.documentElement.setAttribute('data-role',u.role);}catch(e){}})();</script>
  <link rel="stylesheet" href="shared.css">
  <style>
    /* Section tabs: one row that scrolls sideways (scrollbar hidden). The divider lives on the
       non-scrolling bar, so it stays put as the separator between the tabs and the table. */
    .section-bar { position:relative;border-bottom:1px solid var(--border);margin-bottom:16px; }
    .section-tabs { display:flex;flex-wrap:nowrap;gap:4px;padding:6px 6px 12px;margin:-6px -6px 0;overflow-x:auto;scrollbar-width:none;scroll-behavior:smooth;scroll-padding-inline:24px; }
    .section-tabs::-webkit-scrollbar { display:none; }
    .section-bar.fade-end .section-tabs { -webkit-mask-image:linear-gradient(to right,#000 calc(100% - 48px),transparent);mask-image:linear-gradient(to right,#000 calc(100% - 48px),transparent); }
    .section-bar.fade-start .section-tabs { -webkit-mask-image:linear-gradient(to left,#000 calc(100% - 48px),transparent);mask-image:linear-gradient(to left,#000 calc(100% - 48px),transparent); }
    .section-bar.fade-start.fade-end .section-tabs { -webkit-mask-image:linear-gradient(to right,transparent,#000 48px,#000 calc(100% - 48px),transparent);mask-image:linear-gradient(to right,transparent,#000 48px,#000 calc(100% - 48px),transparent); }
    @media (prefers-reduced-motion: reduce) { .section-tabs { scroll-behavior:auto; } }
    .section-tab { height:28px;padding:0 14px;min-width:64px;font-size:var(--fs-sm);font-weight:500;color:var(--text-sub);cursor:pointer;border:1px solid transparent;border-radius:var(--radius-full);background:transparent;transition:color 0.15s,background 0.15s,border-color 0.15s,box-shadow 0.2s,transform 0.12s var(--ease-out);white-space:nowrap;font-family:var(--font);flex:0 0 auto;display:inline-flex;align-items:center;justify-content:center; }
    .section-tab:hover { color:var(--text-main);background:var(--border-light); }
    .section-tab.active { color:var(--red);background:var(--bg-white);border-color:transparent;font-weight:600;box-shadow:0 1px 2px rgba(18,18,18,0.06),0 3px 10px rgba(18,18,18,0.08); }
    .section-tab:active { transform:scale(0.97); }
    @media (prefers-reduced-motion: reduce) { .section-tab:active { transform:none; } }
    .section-tab:focus-visible { outline:2px solid var(--red);outline-offset:2px; }
    #corrTable { min-width:0; }
    #corrTable th,
    #corrTable td { min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap; }
    .corr-avatar { width:34px;height:34px;border-radius:50%;background:var(--avatar-bg);display:flex;align-items:center;justify-content:center;color:#fff;font-size:var(--fs-xs);font-weight:600;flex-shrink:0;overflow:hidden; }
    .corr-avatar img { width:100%;height:100%;object-fit:cover; }
    .corr-name { max-width:180px;font-size:var(--fs-sm);font-weight:600;color:var(--text-main);line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis; }
    .user-cell { display:flex;align-items:center;gap:10px;min-width:0; }
    @media (max-width: 768px) {
      #corrTable th, #corrTable td { padding:6px; font-size:var(--fs-xs); }
      #corrTable th:first-child { width:30% !important; }
      #corrTable th:nth-child(2) { width:18% !important; }
      #corrTable th:nth-child(3) { width:30% !important; }
      #corrTable th:nth-child(4) { width:22% !important; }
      #corrTable .user-cell { gap:6px; }
      #corrTable .corr-avatar { width:28px;height:28px; }
      #corrTable .corr-name { font-size:var(--fs-xs); }
      #corrTable .options-cell { flex-direction:column;align-items:stretch;gap:3px; }
      #corrTable .options-cell button { width:100%;min-width:0;height:22px;min-height:22px;padding:0 3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:10px; }
    }
    .pagination { display:flex;justify-content:flex-end;align-items:center;gap:4px;margin-top:20px; }
    .page-btn { width:30px;height:30px;border-radius:var(--radius-sm);border:1px solid var(--border);background:var(--bg-white);color:var(--text-sub);font-size:var(--fs-sm);font-weight:500;cursor:pointer;font-family:var(--font);display:flex;align-items:center;justify-content:center;transition:background 0.12s; }
    .page-btn:hover { background:var(--bg-surface); }
    .page-btn.active { background:var(--red);color:#fff;border-color:var(--red); }
    .page-btn:disabled { opacity:0.4;cursor:not-allowed; }
    .modal-overlay { display:none;position:fixed;inset:0;background:rgba(20,5,5,0.6);z-index:500;align-items:center;justify-content:center; }
    .modal-overlay.open { display:flex; }
    .modal-box { background:var(--bg-white);border-radius:var(--radius-xl);width:480px;max-width:95vw;padding:28px 32px;box-shadow:0 20px 60px rgba(0,0,0,0.2); }
    .modal-header { display:flex;justify-content:space-between;align-items:center;margin-bottom:20px; }
    .modal-title { font-size:var(--fs-xl);font-weight:700;color:var(--text-main); }
    .modal-close { background:none;border:none;font-size:var(--fs-2xl);color:var(--text-muted);cursor:pointer;line-height:1;padding:0;font-family:var(--font); }
    .modal-close:hover { color:var(--text-main); }
    .modal-footer { display:flex;justify-content:flex-end;gap:10px;margin-top:20px;padding-top:16px;border-top:1px solid var(--border); }
    .alert { display:none;padding:10px 14px;border-radius:var(--radius-md);font-size:var(--fs-sm);font-weight:500;margin-bottom:16px;align-items:center;gap:8px;line-height:1.4; }
    .alert.show { display:flex; }
    .alert-success { background:#f0fdf4;border:1px solid #bbf7d0;color:#166534; }
    .alert-error   { background:var(--red-tint);border:1px solid var(--red-tint-line);color:var(--red); }
    .alert-dot { width:8px;height:8px;border-radius:50%;flex-shrink:0; }
    .alert-success .alert-dot { background:#22c55e; }
    .alert-error   .alert-dot { background:var(--red-bright); }
  </style>
</head>

<script src="cms.js"></script>
<script type="module">
  import { requireAuth, logoutUser } from '../backend/firebase/auth.js';
  import { getAllUsers, approveEditorial, syncPublicProfiles } from '../backend/firebase/firestore.js';

  const user = requireAuth(['editorial', 'adviser']);
  if (!user) throw new Error('Not authenticated');

  document.getElementById('topbar-username').textContent = user.name || user.firstName || 'User';
  document.getElementById('topbar-role').textContent = user.role === 'adviser' ? 'Adviser' : 'Editorial Board';
  if (user.photoURL) {
    document.getElementById('topbar-avatar').innerHTML =
      `<img src="${user.photoURL}" style="width:100%;height:100%;object-fit:cover;border-radius:50%;">`;
  }
  window.__frontlineLogout = logoutUser;

  const ROWS = 10;
  let allUsers      = [];
  let activeSection = 'All';
  let page          = 1;

  const ini = n => (n || '?').split(' ').slice(0,2).map(w => w[0]).join('').toUpperCase();
  const escapeHtml = value => String(value ?? '').replace(/[&<>"']/g, ch => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' })[ch]);
  const displayName = c => toTitleCaseName(c.name || [c.firstName, c.surname].filter(Boolean).join(' ') || '') || 'Unknown';
  let searchQuery = '';

  async function loadUsers() {
    try {
      allUsers = await getAllUsers();
      render();
      // Advisers keep every contributor's public profile (public_profiles) current, so the
      // public portal can show names and photos to visitors. Runs in the background.
      if (user.role === 'adviser') {
        syncPublicProfiles(allUsers)
          .then(({ failed }) => { if (failed) console.warn(`${failed} public profile(s) could not be updated.`); })
          .catch(error => console.warn('Could not update public profiles:', error));
      }
    } catch (e) {
      console.error('Failed to load accounts:', e);
      document.getElementById('corrTableBody').innerHTML =
        `<tr><td colspan="4" style="text-align:center;padding:48px;color:var(--text-muted);">Could not load accounts. Check your connection and permissions, then refresh.</td></tr>`;
    }
  }

  function isInSection(account, section) {
    const assignedSections = [
      ...(Array.isArray(account.sections) ? account.sections : []),
      ...(Array.isArray(account.section) ? account.section : [account.section])
    ];
    const target = section.trim().toLocaleLowerCase();
    return assignedSections.some(value => String(value || '').trim().toLocaleLowerCase() === target);
  }

  function getFiltered() {
    const visibleUsers = allUsers.filter(u => u.role !== 'adviser');
    const bySection = activeSection === 'All'
      ? visibleUsers
      : activeSection === 'Editorial Board'
        ? visibleUsers.filter(u => u.role === 'editorial' || isInSection(u, activeSection))
        : visibleUsers.filter(u => isInSection(u, activeSection));
    if (!searchQuery) return bySection;
    return bySection.filter(u => [displayName(u), u.email, u.section, u.role]
      .some(value => String(value || '').toLocaleLowerCase().includes(searchQuery)));
  }

  // Topbar search (wired in cms.js) filters by name, email, section or role.
  document.addEventListener('frontline:search', e => {
    e.preventDefault();
    searchQuery = (e.detail?.query || '').toLocaleLowerCase();
    page = 1;
    render();
  });

  function render() {
    const data  = getFiltered();
    const total = Math.max(1, Math.ceil(data.length / ROWS));
    if (page > total) page = 1;
    const slice   = data.slice((page-1)*ROWS, page*ROWS);

    document.getElementById('corrTableBody').innerHTML = slice.length
      ? slice.map(c => {
          const name      = displayName(c);
          const isPending = c.status === 'pending';
          return `
            <tr>
              <td data-label="User">
                <div class="user-cell">
                  <div class="corr-avatar">${c.photoURL ? `<img src="${escapeHtml(c.photoURL)}" alt="">` : escapeHtml(ini(name))}</div>
                  <div style="min-width:0">
                    <div class="corr-name" title="${escapeHtml(name)}">${escapeHtml(name)}</div>
                  </div>
                </div>
              </td>
              <td data-label="Section" title="${escapeHtml(toTitleCaseName(c.section || '—'))}">${escapeHtml(toTitleCaseName(c.section || '—'))}</td>
              <td data-label="Email" style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap;" title="${escapeHtml(c.email || '')}">${escapeHtml(c.email||'—')}</td>
              <td>
                <div class="options-cell">
                  <button class="edit-btn" type="button" data-view-id="${escapeHtml(c.id)}">View</button>
                  ${isPending ? `<button class="btn btn-red btn-sm" type="button" data-approve-id="${escapeHtml(c.id)}">Approve</button>` : ''}
                </div>
              </td>
            </tr>`;
        }).join('')
      : `<tr><td colspan="4" style="text-align:center;padding:48px;color:var(--text-muted);font-size:var(--fs-md);">${searchQuery ? 'No correspondents match your search.' : 'No correspondents found in this section.'}</td></tr>`;

    const pag = document.getElementById('pagination');
    if (total <= 1) { pag.innerHTML = ''; return; }
    let h = `<button class="page-btn" ${page===1?'disabled':''} onclick="goPage(${page-1})">&#8249;</button>`;
    for (let i=1;i<=total;i++) h += `<button class="page-btn${i===page?' active':''}" onclick="goPage(${i})">${i}</button>`;
    h += `<button class="page-btn" ${page===total?'disabled':''} onclick="goPage(${page+1})">&#8250;</button>`;
    pag.innerHTML = h;
  }

  window.goPage      = n  => { page = n; render(); };
  // The profile page reads ?uid=. The name is passed too: visitors cannot read users/{uid}, and
  // articles credit their writer by name, so the profile can still find them by it.
  window.viewProfile = id => {
    const person = allUsers.find(c => c.id === id);
    const params = new URLSearchParams({ uid: id });
    if (person) params.set('name', displayName(person));
    window.location.href = `correspondent-profile-public.html?${params.toString()}`;
  };
  document.getElementById('corrTableBody').addEventListener('click', e => {
    const view = e.target.closest('[data-view-id]');
    if (view) return window.viewProfile(view.dataset.viewId);
    const approve = e.target.closest('[data-approve-id]');
    if (approve) window.approveUser(approve.dataset.approveId);
  });
  window.approveUser = async id => {
    if (!confirm('Approve this editorial board account? They will be able to review and assign articles.')) return;
    const result = await approveEditorial(id);
    if (result.success) { showToast('Editorial account approved.', 'success'); loadUsers(); }
    else showToast("Couldn't approve this account. Try again.", 'error');
  };

  document.getElementById('sectionTabs').addEventListener('click', e => {
    const btn = e.target.closest('.section-tab');
    if (!btn) return;
    document.querySelectorAll('.section-tab').forEach(t => { t.classList.remove('active'); t.setAttribute('aria-pressed', 'false'); });
    btn.classList.add('active');
    btn.setAttribute('aria-pressed', 'true');
    activeSection = btn.dataset.section;
    page = 1;
    render();
    btn.scrollIntoView({ block: 'nearest', inline: 'nearest' });
  });

  // Tabs scroll sideways with the scrollbar hidden: map the mouse wheel to horizontal scroll,
  // and fade whichever edge still has tabs beyond it.
  (function initSectionScroller() {
    const bar  = document.getElementById('sectionBar');
    const tabs = document.getElementById('sectionTabs');
    const update = () => {
      const max = tabs.scrollWidth - tabs.clientWidth;
      bar.classList.toggle('fade-start', tabs.scrollLeft > 2);
      bar.classList.toggle('fade-end', tabs.scrollLeft < max - 2);
    };
    tabs.addEventListener('wheel', e => {
      if (tabs.scrollWidth <= tabs.clientWidth || Math.abs(e.deltaX) > Math.abs(e.deltaY)) return;
      e.preventDefault();
      tabs.scrollBy({ left: e.deltaY, behavior: 'instant' });
    }, { passive: false });
    tabs.addEventListener('scroll', update, { passive: true });
    window.addEventListener('resize', update);
    update();
  })();

  const modal       = document.getElementById('addModal');
  const clearAlerts = () => ['alertSuccess','alertError'].forEach(id => document.getElementById(id).classList.remove('show'));
  const clearForm   = () => ['fieldFirstName','fieldSurname','fieldEmail','fieldSection'].forEach(id => { document.getElementById(id).value=''; });
  const closeModal  = () => { modal.classList.remove('open'); clearAlerts(); clearForm(); };

  document.getElementById('openModalBtn').addEventListener('click',   () => { clearAlerts(); clearForm(); modal.classList.add('open'); });
  document.getElementById('closeModalBtn').addEventListener('click',  closeModal);
  document.getElementById('cancelModalBtn').addEventListener('click', closeModal);
  modal.addEventListener('click', e => { if (e.target===modal) closeModal(); });

  document.getElementById('submitBtn').addEventListener('click', async () => {
    clearAlerts();
    const firstName = toTitleCaseName(document.getElementById('fieldFirstName').value);
    const surname   = toTitleCaseName(document.getElementById('fieldSurname').value);
    const email     = document.getElementById('fieldEmail').value.trim();
    const sec       = document.getElementById('fieldSection').value;

    if (!firstName||!surname||!email||!sec) {
      document.getElementById('alertErrorMsg').textContent = 'Enter a first name, surname and email address.';
      document.getElementById('alertError').classList.add('show');
      return;
    }
    if (allUsers.some(u => (u.email || '').toLowerCase() === email.toLowerCase())) {
      document.getElementById('alertErrorMsg').textContent = 'This email is already registered.';
      document.getElementById('alertError').classList.add('show');
      return;
    }

    const btn = document.getElementById('submitBtn');
    btn.textContent = 'Adding...';
    btn.disabled = true;

    try {
      const { addDoc, collection, serverTimestamp } = await import('https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js');
      const { db } = await import('../backend/firebase/firebase-config.js');
      await addDoc(collection(db, 'users'), {
        firstName, surname, name:`${firstName} ${surname}`,
        email: email.toLowerCase(), section:sec, role:'correspondent', status:'invited', createdAt:serverTimestamp()
      });
      document.getElementById('alertSuccessMsg').textContent = `"${firstName} ${surname}" added. They can register using ${email}.`;
      document.getElementById('alertSuccess').classList.add('show');
      clearForm();
      loadUsers();
    } catch(e) {
      document.getElementById('alertErrorMsg').textContent = "Couldn't add this correspondent. Try again.";
      document.getElementById('alertError').classList.add('show');
    } finally {
      btn.textContent = 'Add correspondent';
      btn.disabled = false;
    }
  });

  await loadUsers();
</script>
</body>
</html>
